name: Build Release APK & AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Tools
        run: |
          java -version
          flutter --version

      - name: Install Dependencies
        working-directory: moneytrace
        run: |
          flutter clean
          flutter pub get

      - name: Build Release APK
        working-directory: moneytrace
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Build Release App Bundle (AAB)
        working-directory: moneytrace
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParaIz-Release-APK
          path: moneytrace/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParaIz-Release-AAB
          path: moneytrace/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

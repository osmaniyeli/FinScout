name: moneytrace
description: "Paraİz (MoneyTrace) - Deterministik Veri Motoru & Harcama Zekası Platformu"
publish_to: 'none'
version: 3.15.0+18

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Grafikler
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1

  # Yerel Depolama & Veritabanı
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0

  # PDF Okuma & Güvenlik
  file_picker: ^8.0.5
  crypto: ^3.0.3

  # Yardımcı & Biçimlendirme
  share_plus: ^10.0.0
  url_launcher: ^6.3.0

  # Google Play Billing, bildirimler, hesap
  in_app_purchase: ^3.2.0
  flutter_secure_storage: ^10.3.4
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  pdfrx: ^2.6.5
  pdfrx_engine: ^0.6.1
  in_app_purchase_android: 0.5.3
  supabase_flutter: ^2.17.2
  google_sign_in: ^7.2.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

  # Ana ekran widget'ları (Aylık Değişim/Harcama/Maaş): Flutter ↔ native AppWidgetProvider köprüsü
  home_widget: ^0.10.0
  # Native splash: açılışta boş beyaz ekran yerine marka rengi + ikon (bkz. main.dart)
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Repository/veritabanı testleri için: flutter test VM'de gerçek platform kanalı olmadığından
  # sqflite'ı FFI (masaüstü sqlite3) üzerinden çalıştırır. Yalnız test; uygulama kodu etkilenmez.
  sqflite_common_ffi: ^2.3.3
  # Aynı testlerde path_provider'ı platform kanalı olmadan sahte bir geçici klasöre yönlendirmek için.
  path_provider_platform_interface: ^2.1.2

flutter:
  uses-material-design: true

  assets:
    - assets/dictionaries/
    - assets/sql/
    - assets/config/
    - assets/banks/
    - assets/splash/

# `dart run flutter_native_splash:create` ile üretilir (android/app/src/main/res/ altına native
# kaynaklar yazar). Görsel: mevcut ic_launcher_foreground.png (marka ikonu) — yeni görsel YOK.
# Marka rengi: AppColors.actionPrimary (lib/core/theme/app_colors.dart) ile aynı kobalt mavisi.
flutter_native_splash:
  color: "#2563EB"
  image: assets/splash/branding_icon.png
  android_12:
    image: assets/splash/branding_icon.png
    icon_background_color: "#2563EB"
    color: "#2563EB"
  android_min_sdk: 24
  fullscreen: false
  android: true
  ios: false
  web: false
